name: Feature proposal
description: Propose a new option or behavior.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The scope is still taking shape, and feedback drives it. For a broad change, such as something currently [out of scope](https://github.com/ngsignal/mutation/blob/main/docs/ROADMAP.md#out-of-scope), [start a discussion](https://github.com/ngsignal/mutation/discussions) to make the case.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you're trying to do, and why it's hard today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The API you have in mind, if any.
