version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Skip versions published less than a week ago: compromised releases are usually pulled by then.
    cooldown:
      default-days: 7
    groups:
      angular:
        patterns:
          - "@angular/*"
      npm-dev-dependencies:
        dependency-type: development
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
