version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Skip versions published less than a week ago: compromised releases are usually pulled by then.
    cooldown:
      default-days: 7
    groups:
      angular:
        patterns:
          - "@angular/*"
      npm-dev-dependencies:
        dependency-type: development
        patterns:
          - "*"

  # Keeps the demo on main on the latest release for local runs (the deployed demo is pinned by
  # the Demo release workflow). It only follows the library's own releases, which need no cooldown.
  - package-ecosystem: npm
    directory: /examples/demo
    schedule:
      interval: daily
    allow:
      - dependency-name: "@ngsignal/mutation"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
