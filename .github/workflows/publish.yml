name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Protection rules (required reviewer) live in Settings > Environments > npm.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24 bundles npm >= 11.5.1, required for trusted publishing.
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Never restore a cache here: a poisoned cache could alter the published package.
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing (requires >=11.5.1)
        run: |
          npm_version="$(npm --version)"
          if [ "$(printf '%s\n' 11.5.1 "$npm_version" | sort -V | head -n1)" != 11.5.1 ]; then
            echo "npm $npm_version is too old for trusted publishing"
            exit 1
          fi

      # This job can mint an npm publish token (id-token: write): never run dependencies' install scripts here.
      - run: npm ci --ignore-scripts

      - name: Verify tag matches package.json version
        run: |
          pkg_version="v$(node -p "require('./package.json').version")"
          if [ "$pkg_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check package exports & types
        run: npm run check:exports

      - name: Publish
        run: npm publish

  demo:
    needs: publish
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: $/.github/workflows/demo-release.yml
