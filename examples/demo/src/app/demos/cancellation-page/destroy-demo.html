<div class="actions">
  <button type="button" (click)="create('Grace')">Create "Grace"</button>
  <button type="button" (click)="destroyChildInjector()" [disabled]="destroyed()">
    Destroy the injector
  </button>
</div>
<p class="hint">
  Create "Grace", destroy the injector while the call is in flight, then create "Grace" again.
</p>
<app-activity-log heading="Callbacks and mutate()" [entries]="log.entries()" />
<app-activity-log heading="Server" [entries]="server.requests()" />
