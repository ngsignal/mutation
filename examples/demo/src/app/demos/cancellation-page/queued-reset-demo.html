<div class="actions">
  <button type="button" (click)="createTwo()" [disabled]="createUser.isPending()">
    Create "First" and "Second"
  </button>
  <button type="button" (click)="createUser.reset()">Reset</button>
</div>
<p class="hint">
  "Second" waits for "First" (<code>concurrency: 'queue'</code>). Reset before "First" settles
  (2 s, an artificial delay).
</p>
<app-activity-log heading="mutate()" [entries]="log.entries()" />
<app-activity-log heading="Server" [entries]="server.requests()" />
