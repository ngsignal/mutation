<div class="actions">
  <button type="button" (click)="create('Ada')" [disabled]="createUser.isPending()">
    Create "Ada"
  </button>
  <!-- #region code -->
  <button type="button" (click)="createUser.reset()">Reset</button>
  <!-- #endregion -->
  <span class="status-pill" role="status" [attr.data-status]="createUser.status()">{{
    createUser.status()
  }}</span>
</div>
<p class="hint">Create "Ada", then reset before the 2 s (an artificial delay) are over.</p>
<app-activity-log heading="Callbacks and mutate()" [entries]="log.entries()" />
<app-activity-log heading="Server" [entries]="server.requests()" />
