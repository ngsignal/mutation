<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="@ngsignal/mutation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>@ngsignal/mutation</title>
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="55.1" y1="210.8" x2="456.9" y2="301.2">
      <stop offset="0" stop-color="#FF2D68"/><stop offset=".52" stop-color="#AB2599"/><stop offset="1" stop-color="#4823DD"/>
    </linearGradient>
    <linearGradient id="m" gradientUnits="userSpaceOnUse" x1="256" y1="147" x2="256" y2="362">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9D9FB"/>
    </linearGradient>
    <linearGradient id="s" gradientUnits="userSpaceOnUse" x1="156" y1="0" x2="356" y2="0">
      <stop offset="0" stop-color="#FF2D68"/><stop offset=".5" stop-color="#AB2599"/><stop offset="1" stop-color="#4823DD"/>
    </linearGradient>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="b"/>
      <feOffset in="b" dy="7" result="o"/>
      <feFlood flood-color="#2A0640" flood-opacity="0.34" result="f"/>
      <feComposite in="f" in2="o" operator="in"/>
    </filter>
  </defs>
  <style>
    /* Une seule duree partagee, aucun animation-delay : le calage vit dans les
       pourcentages de chaque @keyframes, donc pas de derive entre les elements.
       Parcours du M : bas-gauche, haut-gauche, haut-droite, bas-droite. */
    .n { transform-box: fill-box; transform-origin: center; animation: 2.4s linear infinite; }
    .n1 { animation-name: n1 } .n2 { animation-name: n2 }
    .n3 { animation-name: n3 } .n4 { animation-name: n4 }
    .sig { stroke-dasharray: 18 200; animation: run 2.4s linear infinite; }

    @keyframes n1 { 0%,100% { transform: scale(1) }     4% { transform: scale(1.18) } 13% { transform: scale(1) } }
    @keyframes n2 { 0%,16%,100% { transform: scale(1) } 20% { transform: scale(1.18) } 29% { transform: scale(1) } }
    @keyframes n3 { 0%,46%,100% { transform: scale(1) } 50% { transform: scale(1.18) } 59% { transform: scale(1) } }
    @keyframes n4 { 0%,62%,100% { transform: scale(1) } 66% { transform: scale(1.18) } 75% { transform: scale(1) } }

    /* Tete du trait : position 0 du chemin a 16% (noeud 2), position 100 a 50% (noeud 3),
       puis la queue est absorbee par le noeud jusqu'a 58%. */
    @keyframes run { 0%,16% { stroke-dashoffset: 18 } 50% { stroke-dashoffset: -82 } 58%,100% { stroke-dashoffset: -118 } }

    @media (prefers-reduced-motion: reduce) {
      .n { animation: none } .sig { animation: none; opacity: 0 }
    }
  </style>

  <path d="M 267.3 30.5 L 445.7 133.5 Q 456.9 140.0 456.9 153.0 L 456.9 359.0 Q 456.9 372.0 445.7 378.5 L 267.3 481.5 Q 256.0 488.0 244.7 481.5 L 66.3 378.5 Q 55.1 372.0 55.1 359.0 L 55.1 153.0 Q 55.1 140.0 66.3 133.5 L 244.7 30.5 Q 256.0 24.0 267.3 30.5 Z" fill="url(#g)"/>

  <g filter="url(#sh)">
    <g fill="none" stroke="#000" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"><path d="M 156 184 L 256 283 L 356 184"/><path d="M 156 184 L 156 328"/><path d="M 356 184 L 356 328"/></g>
    <g fill="#000"><circle cx="156" cy="184" r="37"/><circle cx="356" cy="184" r="37"/><circle cx="156" cy="328" r="34"/><circle cx="356" cy="328" r="34"/></g>
  </g>

  <g fill="none" stroke="url(#m)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"><path d="M 156 184 L 256 283 L 356 184"/><path d="M 156 184 L 156 328"/><path d="M 356 184 L 356 328"/></g>

  <path class="sig" pathLength="100" d="M 156 184 L 256 283 L 356 184"
        fill="none" stroke="url(#s)" stroke-width="13" stroke-linecap="round"/>

  <g fill="url(#m)">
    <circle class="n n1" cx="156" cy="328" r="34"/>
    <circle class="n n2" cx="156" cy="184" r="37"/>
    <circle class="n n3" cx="356" cy="184" r="37"/>
    <circle class="n n4" cx="356" cy="328" r="34"/>
  </g>
</svg>
